context:
  name: sofa-python3
  version: "26.06"
  major_minor: ${{ (version | split('.'))[:2] | join('.') }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/sofa-framework/SofaPython3/archive/refs/tags/release-v${{ major_minor }}.tar.gz
  sha256: 880d9f1d5c34e769ccb1e006173e08b5d7c96c156147dc67a290da1142ad7d0e

  patches:
    # See comments in sofa conda package recipe at file
    # scripts/hotfix-sofa-run-macos.sh for more details.
    # This hotfix breaks python module installation on Windows, so we
    # only apply on macOS.
    - if: osx
      then:
        - patches/0001-hotfix-for-libpython-linking-on-macOS.patch

build:
  number: 0
  files:
    # SofaPython3 as a weird conception of each module, both
    # a as a python binding module and a SOFA component (which contain CMake config files),
    # so each is installed twice. This causes problems with duplicates and incorrectly
    # installed pyd and lib files (both at Library/{lib/bin} and lib/site-packages).
    # Fix here remove the duplicate one in Library/{lib/bin} and patch its CMake config files
    # to points the one inside site-packages instead. But this should be fixed upstream.
    # See https://github.com/sofa-framework/conda-ci/issues/27
    # An explicit include keeps the package from coming out empty on linux/osx,
    # where the win-only exclude list below renders to nothing.
    include:
      - "**"
    exclude:
      - if: win
        then:
          - Library/bin/*.pyd
          - Library/lib/SofaRuntime.lib
          - Library/lib/SofaExporter.lib
          - Library/lib/Gui.lib
          - Library/lib/SofaTypes.lib

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
        - pybind11
  host:
    - sofa-devel ${{ major_minor }}.*
    - sofa-gl ${{ major_minor }}.*
    - eigen
    - python
    - numpy
    # pybind11 3.1.0 makes any keep_alive<0, N> binding segfault when called
    # with arguments that match no overload (e.g. Node.addObject(1.0)).
    # Fixed by pybind/pybind11#6183; lift this once a fixed release is out.
    - pybind11 <3.1
  run:
    - python
    - pybind11
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - SofaPython3/config.h
      lib:
        - SofaPython3
  - python:
      imports:
        - Sofa
        - SofaRuntime
        - SofaTypes
        - SofaExporter
  # Imports alone do not show the bindings work: step a small scene, driving it
  # from a Python Controller and reading state back through numpy.
  - script:
      - python run_test_sofapython3.py
    files:
      recipe:
        - run_test_sofapython3.py
    requirements:
      run:
        - numpy
  - script:
      - cmake-package-check SofaPython3
    requirements:
      run:
        - cmake-package-check
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}

about:
  homepage: https://github.com/sofa-framework/SofaPython3
  summary: A python plugin for Sofa offering a pythonic interface and python3 support.
  license: LGPL-2.1-or-later
  license_file: License.md
  documentation: https://sofapython3.readthedocs.io/
  repository: https://github.com/sofa-framework/SofaPython3

extra:
  recipe-maintainers:
    - olivier-roussel
    - hugtalbot
    - bakpaul
